<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ドリンクメニュー｜うおやん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Dela+Gothic+One&family=Yuji+Syuku&family=Shippori+Mincho+B1:wght@500;600;700&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="/menu.css">
<link rel="stylesheet" href="/menu-themes.css">
<style>
  html,body{margin:0;background:#3b3632}
  body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;color:#f3efe8;
    padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  [hidden]{display:none!important}
  .bar{max-width:1000px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:12px}
  .bar a,.bar button{font:inherit;font-weight:700;font-size:.9rem;padding:9px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:inherit;text-decoration:none;cursor:pointer;min-height:40px}
  .bar button.primary{background:#f3efe8;color:#2a2520;border-color:#f3efe8}
  .bar .info{flex:1;min-width:0;font-size:.8rem;opacity:.75}
  .stage{max-width:1000px;margin:0 auto;overflow:hidden;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .stage .dm{transform-origin:top left}
  .msg{max-width:1000px;margin:40px auto;text-align:center;opacity:.8}
  @page{size:A4 portrait;margin:0}
  @media print{
    html,body{background:#fff;padding:0}
    .bar,.msg{display:none!important}
    .stage{max-width:none;height:auto!important;border-radius:0;box-shadow:none;overflow:visible}
    .stage .dm{transform:none!important;zoom:.7937}
  }
</style>
</head>
<body>
<div class="bar">
  <a href="/" id="back">← もどる</a>
  <span class="info" id="info"></span>
  <button type="button" class="primary" id="print">印刷・PDFで保存</button>
</div>
<p class="msg" id="msg">読み込み中…</p>
<div class="stage" id="stage" hidden></div>
<script src="/menu-illust.js"></script>
<script src="/menu-render.js"></script>
<script>
'use strict';
(async () => {
  const stage = document.getElementById('stage'), msg = document.getElementById('msg');
  const fit = () => {
    const dm = stage.firstElementChild; if (!dm) return;
    const s = Math.min(1, stage.clientWidth / 1000);
    dm.style.transform = 'scale(' + s + ')';
    stage.style.height = Math.round(1414 * s) + 'px';
  };
  try {
    const r = await fetch('/api/pricelist?id=drink', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    const p = j.pricelist;
    const th = new URLSearchParams(location.search).get('theme');
    stage.hidden = false; msg.hidden = true;
    const draw = () => { stage.innerHTML = ''; stage.innerHTML = DrinkMenu.render(p.data, th); fit(); DrinkMenu.fit(stage.firstElementChild); };
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    const t = new Date(p.updated_at).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric' });
    document.getElementById('info').textContent = '最終更新：' + t + (p.updated_by && p.updated_by !== '初期データ' ? '（' + p.updated_by + 'さん）' : '');
  } catch (e) {
    msg.textContent = 'メニュー表を読み込めなかった。電波を確認して、開き直してね';
  }
  addEventListener('resize', fit);
  document.getElementById('print').onclick = () => window.print();
})();
</script>
</body>
</html>
