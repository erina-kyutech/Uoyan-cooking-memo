<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うおやん調理メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sticky search + category tabs, single column of recipe cards sized for one-handed reading in the kitchen */
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#1d2433; --muted:#626b7c; --line:#dcdfe3;
  --accent:#c4472b; --accent-soft:#f6e3dc;
  --chin:#2f6db3; --chin-bg:#e3edf8;
  --yaki:#b8402a; --yaki-bg:#f8e4de;
  --age:#a8700c; --age-bg:#f7ecd2;
  --warn:#8a5a00; --warn-bg:#fff3cf;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --card:#1d222b; --ink:#eceef2; --muted:#9aa3b2; --line:#2e3542;
  --accent:#ff7a59; --accent-soft:#3a2420;
  --chin:#7fb0ef; --chin-bg:#1d2c42;
  --yaki:#ff8f75; --yaki-bg:#3b221d;
  --age:#f0bd55; --age-bg:#372c14;
  --warn:#f0c860; --warn-bg:#3a3014;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d222b; --ink:#eceef2; --muted:#9aa3b2; --line:#2e3542;
  --accent:#ff7a59; --accent-soft:#3a2420;
  --chin:#7fb0ef; --chin-bg:#1d2c42;
  --yaki:#ff8f75; --yaki-bg:#3b221d;
  --age:#f0bd55; --age-bg:#372c14;
  --warn:#f0c860; --warn-bg:#3a3014;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:24px 8px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;font:inherit;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{outline:none;border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:.85rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.card summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);padding-top:12px}
section{padding-top:22px}
h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:500}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;gap:6px}
.card summary::-webkit-details-marker{display:none}
.name{font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.name::after{content:"＋";color:var(--muted);font-weight:500;flex:none}
.card[open] .name::after{content:"－"}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-chin{color:var(--chin);background:var(--chin-bg)}
.c-yaki{color:var(--yaki);background:var(--yaki-bg)}
.c-age{color:var(--age);background:var(--age-bg)}
.c-boss{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.c-warn{color:var(--warn);background:var(--warn-bg)}
.body{padding:0 14px 14px;border-top:1px dashed var(--line);margin:0 14px;padding-inline:0;padding-top:10px}
ol{margin:0;padding-left:1.4em;display:grid;gap:4px}
ol li::marker{color:var(--accent);font-weight:700}
.row{margin-top:10px;font-size:.92rem;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.row dt{font-weight:700;color:var(--muted);font-size:.8rem;padding-top:2px}
.row dd{margin:0;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair div{background:var(--bg);border-radius:8px;padding:8px 10px}
.pair b{display:block}
.pair span{font-size:.85rem;color:var(--muted)}
.note{background:var(--yaki-bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.92rem;display:grid;gap:6px}
.note b{color:var(--yaki)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>うおやん<span>調理メモ</span></h1>
    <p class="sub">メニューごとの作り方・時間・盛り付け。タップで開く。</p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="メニュー名で検索（例：ピザ、手羽）" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="legend">
    <span class="chip c-chin">チン</span><span class="chip c-yaki">焼く</span><span class="chip c-age">揚げる</span><span class="chip c-warn">要確認</span>
  </div>
  <main id="main"></main>
</div>

<script>
const C="chin",Y="yaki",A="age";
const DATA=[
 {cat:"揚げ物",items:[
  {n:"若どり塩唐揚げ",t:[[A,"6分"]],s:["塩胡椒をふる","片栗粉をまぶす","6分揚げる"],m:"柑橘・パセリ、天紙"},
  {n:"若どりチキン南蛮",t:[[A,"6分"]],s:["片栗粉をまぶしてから卵につける","6分揚げる","揚げている間に、でかい木の皿に柑橘・パセリ・紅生姜・タルタル（大きめの皿、パセリ・パプリカを振る）をのせる","チキンに「タルタル」と書かれた南蛮用のたれをかける","パセリ、糸唐辛子をのせる"]},
  {n:"白身フライタルタル",t:[[A,"5分"]],s:["5分揚げる","タルタルを用意（小さい皿、パセリ・パプリカ）"],m:"チシャを敷く、柑橘・パセリ"},
  {n:"手羽唐揚げ（手羽先の揚げ）",t:[[C,"2分"],[A,"7分"]],s:["2分チン","7分揚げる"],m:"柑橘・パセリ、天紙",x:"メニュー表では3本"},
  {n:"フライドポテト",t:[[A,"2分"]],s:["2分揚げる","パセリと塩を振る","ケチャップを添える"]},
  {n:"山いも揚げ出し",t:[[A,"1分"],["boss","切るのは店長"]],s:["山いもを乱切り（切るのは店長がやることが多い。ここからは自分たちでやる）","片栗粉をつけて1分揚げる","揚げ出し用のつゆを200ml入れて沸騰させる"],m:"のり、ねぎ"},
  {n:"あげもち（揚げ出しもち）",t:[[A,"2分"]],s:["もち2個をそれぞれ2等分","片栗粉をまぶす","2分揚げる","だし200mlをはる"],m:"大根おろし、のり、ねぎ"},
  {n:"タコから",t:[[A,"1分"]],s:["タコの水気を切る","片栗粉をまぶす","1分揚げる","ほりにしをかける"],m:"柑橘・パセリ、天紙"},
  {n:"ホルモン唐揚げ",t:[[C,"1分"],[A,"40秒"]],s:["1分チン","片栗粉をしっかりまぶす","40秒揚げる"],m:"柚子味噌・ごま、七味マヨ"},
  {n:"まぐろの竜田あげ",t:[[A,"1分"]],s:["水分を取る","片栗粉を多めにまぶす","1分揚げる"],m:"柑橘・パセリ、天紙",x:"1人前 12枚くらい"},
  {n:"小エビのからあげ",t:[[A,"1分"]],s:["1分揚げる","ほりにしをかける"],m:"柑橘・パセリ、天紙"},
  {n:"銀杏揚げ",t:[[A,"2分"]],s:["2分揚げる","皮がつかないように盛り付ける","パセリをのせて塩"]},
  {n:"ごぼうのからあげ",t:[[A,"2分"]],s:["塩コショウ","2分揚げる","ほりにしをかけて出す"],m:"柑橘・パセリ、天紙"},
  {n:"砂ずり唐揚げ",t:[[A,"2分"]],s:["塩コショウ・S・料理酒をする","2分揚げる","ほりにしをかけて出す"],m:"柑橘・パセリ、天紙"}
 ]},
 {cat:"焼き物",items:[
  {n:"サバの塩焼き",t:[[Y,"5分"]],s:["5分焼く"],m:"大葉、大根おろし、柑橘"},
  {n:"ホッケ塩焼き",t:[[C,"7分"],[Y,"7分"]],s:["7分チン","油を塗って酒を振る","7分焼く"],m:"大葉、大根おろし、柑橘"},
  {n:"かま塩",t:[[C,"6〜7分"],[Y,"6〜7分"]],s:["6〜7分チン","6〜7分焼く"],m:"大葉、大根おろし、柑橘",x:"ほぼ7分。小さいときは6分"},
  {n:"手羽先塩焼き",t:[[C,"4分"],[Y,"10分"]],s:["4分チン","10分焼く（5分で裏返す）"],x:"メニュー表では3本"},
  {n:"イカ七輪焼き",t:[[C,"1分"]],s:["1分チン","料理酒をかける","焼く"],m:"マヨネーズ・一味"},
  {n:"エイヒレ炙り",t:[[Y,"フライパン"]],s:["小さければ2枚、大きければ1枚","フライパンで料理酒を振って焼く","ハサミで切れるくらいまで焼く（固くて切りづらいならもっと焼く）","ハサミで切る"],m:"一味マヨ、大葉"},
  {n:"赤ウインナー",t:[[C,"1分30秒"],[Y,"フライパン"]],s:["1分30秒チン","フライパンでS・塩胡椒を振って焼く","中が冷えてることがあるのでちゃんと焼く","チシャを敷いて並べる"],m:"マヨ（一味なし）、パセリ、柑橘"},
  {n:"山いも鉄板チーズのせ",t:[[Y,"3分"],[Y,"あつあつなら2分"]],s:["山いもおたま4杯、醤油麹スプーン1杯、卵、水大さじ1を、空気を含ませながらかき混ぜる","鉄板に流し入れて3分焼く（あつあつのときは2分）。上が焦げないように注意","揺らしてタプタプじゃなければチーズをのせる","チーズがこんがり色になるまで焼く","取り出してネギと鰹節をのせる"]},
  {n:"餃子",t:[[Y,"強火・蓋"]],s:["油を引く","8個のせる","お湯120mlを入れて蓋、強火","水が飛んで焼き目がついたらOK","鉄板にごま油をのせて温め、餃子をのせる"],m:"ポン酢、ラー油"}
 ]},
 {cat:"ピザ",note:{h:"ピザの焼き方（3種共通）",s:["焼き台が冷めているときは2分、かま塩の後などあつあつのときは1分でタイマーをかける","なるべく焼き台の左側で焼く（右側は火力が強く、下が焦げやすい）","タイマーが鳴ったら下の焦げ具合を確認して回す","チーズがきつね色に焼けたら取り出す","8等分に切る。最後までちゃんと切る"]},items:[
  {n:"まぐろ生ハムピザ",t:[[Y,"1〜2分"]],s:["ケチャップ、バジルソースを塗る","生ハム、玉ねぎをのせる","オリーブオイル、ほりにし","チーズをのせて焼く","ベーコン、パセリをのせる"]},
  {n:"サバカレーピザ",t:[[Y,"1〜2分"]],s:["鯖缶にソース1杯を混ぜてのせる","玉ねぎをのせる","ほりにし、オリーブオイル","チーズをのせて焼く","ベーコン、パセリをのせる"]},
  {n:"しらすとネギのピザ",t:[[Y,"1〜2分"]],s:["専用たれを塗る","しらすをのせる","オリーブオイル","チーズをのせて焼く","海苔、れもんをのせる"]}
 ]},
 {cat:"パン・クラッカー",items:[
  {n:"ガーリックトースト",t:[[Y,"1分"]],s:["ガーリックバターを塗る（塗りすぎ注意）","1分焼く"]},
  {n:"とりの白レバーペースト with パン",t:[[Y,"パン 1分"]],s:["白レバーペーストにブラックペッパーをかける","パンを1分焼く","パセリをのせる"]},
  {n:"まぐろスモークとアボカドタルタル with パン",t:[[Y,"パン 1分"],["boss","仕上げは店長"]],s:["タルタルを用意（でかい方の器）","パン6枚を1分焼く","あとは店長がやってくれる"]},
  {n:"ノザキのコンビーフ with クラッカー",t:[],s:["コンビーフにブラックペッパー","クラッカーを添える"]}
 ]},
 {cat:"やっこ",note:{h:"やっこ共通",s:["大葉の上に豆腐をのせてから、それぞれの具をのせる"]},items:[
  {n:"しらすやっこ",t:[],s:["しらす、ネギをのせる"]},
  {n:"イカ塩辛やっこ",t:[],s:["塩辛、ネギをのせる"]},
  {n:"ネギトロやっこ",t:[],s:["ネギトロに大葉とミョウガを刻み入れて混ぜる","豆腐にのせてネギ"]},
  {n:"チャンジャやっこ",t:[],s:["チャンジャをのせる","ごまをふる"]}
 ]},
 {cat:"煮物・酒蒸し",items:[
  {n:"あったか肉とうふ",t:[],s:["だし400ml","豆腐を6等分","肉を入れる"],m:"とろろこんぶ、ねぎ。柚子胡椒は別皿"},
  {n:"あさりの酒蒸し",t:[],s:["酒150ml","味の光 カップ1","S"]},
  {n:"アサリバター",t:[],s:["酒150ml、水150ml","味の光 カップ1","S"]}
 ]},
 {cat:"小鉢・珍味",items:[
  {n:"珍味（酒盗・塩辛・梅くらげ・梅水晶・チャンジャ）",t:[],s:["大葉を敷く","大葉の上にそれぞれの具をのせる","下の表のトッピングをのせる"],pair:[["まぐろ酒盗","ネギ"],["イカ塩辛","ネギ"],["梅くらげ","ごま"],["梅水晶","ごま"],["チャンジャ","ごま"]]},
  {n:"まぐろ酒盗とクリームチーズ",t:[],s:["酒盗は単品と同じ","クリームチーズを1個のせる","クラッカーを添える"]},
  {n:"チャンジャクリームチーズ",t:[],s:["チャンジャは単品と同じ","クリームチーズを1個のせる","韓国海苔を添える"]},
  {n:"ネギトロのみ",t:[],s:["ネギトロをのせる"],m:"のり、ネギ、わさび"},
  {n:"コリコリとり皮酢",t:[],s:["大葉、玉ねぎを敷く","鶏皮をのせる","ごま、ねぎ","ポン酢、柚子胡椒"]},
  {n:"ポテトサラダ",t:[],s:["チシャを敷く","ポテサラをのせる","パセリ、パプリカ、ミニトマトを添える"]},
  {n:"塩ダレきゅうり",t:[],s:["きゅうり1本を乱切り","塩だれ、ごま油で和える"]},
  {n:"枝豆",t:[[C,"1.5分"]],s:["1.5分チン","水にさらす","塩を振って出す"]},
  {n:"サバのぬか炊き（イワシも）",t:[[C,"1分半"]],s:["1分半チン"],x:"鯖・イワシのぬかだき どちらも同じ"},
  {n:"ミックスナッツ",t:[],s:["器に入れるだけ"]}
 ]},
 {cat:"ご飯もの",items:[
  {n:"お茶漬け（共通）",t:[],s:["ごはんをつぐ","お茶漬けのもと、具材をのせる","塩辛のときはねぎ、それ以外はごま","漬物を添える"],x:"梅・さけ・チャンジャ・イカ塩辛 すべてこの手順"},
  {n:"明太茶漬け",t:[[C,"明太子 20秒"]],s:["明太子を20秒チン","お茶漬けと同じ手順で作る（ごま・漬物）"]},
  {n:"TKG",t:[],s:["ごはんをつぐ","卵、紅生姜、醤油麹をのせる"]},
  {n:"ミニネギトロ丼",t:[],s:["ごはんの上にごま、のり","ネギトロを広げてのせる","のり、ネギをのせる"],m:"吸い物、わさび、漬物をつける"},
  {n:"白ごはん",t:[],s:["ごはんをつぐ","ごまをかける","漬物と一緒に出す"]}
 ]},
 {cat:"店長担当",items:[
  {n:"お刺身（全種）",t:[["boss","店長が担当"]],s:["刺身はすべて店長がやる"],x:"赤身ブツ切り・大トロ・中トロ・サーモン・ヒラス・ゴマヒラス"},
  {n:"そのほか店長がやるメニュー",t:[["boss","店長が担当"]],s:["板わさ","冷やしトマトスライス","もろきゅう","炙り明太子","まぐろ生ハムクリームチーズ"]}
 ]}
];
const LBL={chin:"チン",yaki:"焼く",age:"揚げる",warn:"",boss:""};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cat="すべて";
const tabs=document.getElementById("tabs"),main=document.getElementById("main"),q=document.getElementById("q");
["すべて",...DATA.map(d=>d.cat)].forEach(c=>{
  const b=document.createElement("button");b.className="tab";b.textContent=c;b.type="button";
  b.setAttribute("aria-pressed",c===cat);b.onclick=()=>{cat=c;[...tabs.children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
  tabs.appendChild(b);
});
function card(it){
  const chips=it.t.map(([k,v])=>`<span class="chip c-${k}">${LBL[k]?LBL[k]+" ":""}${esc(v)}</span>`).join("");
  let body="";
  if(it.s) body+=`<ol>${it.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  if(it.pair) body+=`<div class="pair"${it.s?' style="margin-top:10px"':''}>${it.pair.map(([a,b])=>`<div><b>${esc(a)}</b><span>→ ${esc(b)}</span></div>`).join("")}</div>`;
  let dl="";
  if(it.m) dl+=`<dt>盛り付け</dt><dd>${esc(it.m)}</dd>`;
  if(it.x) dl+=`<dt>メモ</dt><dd>${esc(it.x)}</dd>`;
  if(dl) body+=`<dl class="row">${dl}</dl>`;
  return `<details class="card"><summary><div class="name">${esc(it.n)}</div>${chips?`<div class="chips">${chips}</div>`:""}</summary><div class="body">${body}</div></details>`;
}
function render(){
  const term=q.value.trim();
  let html="";
  DATA.forEach(d=>{
    if(cat!=="すべて"&&d.cat!==cat)return;
    const items=d.items.filter(it=>!term||it.n.includes(term)||(it.pair||[]).some(p=>p[0].includes(term))||d.cat.includes(term));
    if(!items.length&&!(d.note&&!term))return;
    const note=d.note?`<div class="note"><b>${esc(d.note.h)}</b><ol>${d.note.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:"";
    html+=`<section><h2>${esc(d.cat)}${items.length?`<small>${items.length}品</small>`:""}</h2>${note}<div class="list">${items.map(card).join("")}</div></section>`;
  });
  main.innerHTML=html||`<p class="empty">「${esc(term)}」に当てはまるメニューがありません</p>`;
  if(term) main.querySelectorAll("details").forEach(d=>d.open=true);
}
